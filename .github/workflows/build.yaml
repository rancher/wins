name: Build Windows artifacts

on:
  workflow_call:
    inputs:
      tag:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Build and validate with AppCo Go
        env:
          TAG: ${{ inputs.tag }}
        run: |
          GO_VERSION=$(sed -n 's/^go \([0-9]*\.[0-9]*\).*/\1/p' go.mod)
          docker buildx build \
            --file Dockerfile.build \
            --build-arg GO_VERSION="${GO_VERSION}" \
            --build-arg TAG="${TAG}" \
            --output type=local,dest=dist .

      - name: Upload Windows build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-build
          path: |
            dist/artifacts/
            dist/bin/
            dist/tests/integration/bin/test_service.exe
            dist/suc/pkg/host/wins.exe
          if-no-files-found: error

      - name: Upload release artifacts
        if: inputs.tag != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifacts
          path: |
            dist/artifacts/wins.exe
            dist/artifacts/sha256.txt
            dist/artifacts/sha512.txt
            dist/artifacts/install.ps1
            dist/artifacts/uninstall.ps1
            dist/LICENSE
          if-no-files-found: error
