name: Release

on:
  push:
    tags:
      - '*'

jobs:
  create-push-image-windows-2022:
    runs-on: windows-2022
    env:
      REPO: rancher
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: retrieve dockerhub credentials
        uses: rancher-eio/read-vault-secrets@0da85151ad1f19ed7986c41587e45aac1ace74b6 # v3
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/dockerhub/rancher/credentials username | DOCKER_USERNAME ;
            secret/data/github/repo/${{ github.repository }}/dockerhub/rancher/credentials password | DOCKER_PASSWORD

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 'stable'
          cache: 'false'

      - name: Install Dependencies
        run: |
          go install github.com/magefile/mage@69e6f824732575e57977f68f8f3dd78313d666e5 # v1.16
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@c0d3ddc9cf3faa61a4e378e879ece580256d76e5 # v2.12.2
      
      # added a start docker service step to ensure that the docker service is running before running the e2e tests
      - name: Start Docker Service
        id: start-docker-service
        run: |
          $dockerSvc = Get-Service -Name "docker"
          if ($dockerSvc.Status -ne "Running") {
            Start-Service -Name "docker"
          }

      - name: build-binary
        run: |
          set PSModulePath=&&powershell -command "mage ci"

      # Note: We cannot use the docker/build-push-action as it requires dependencies
      # which cannot be installed onto windows VMs. Additionally, it is not possible to cross compile
      # Windows images on linux. So, we're stuck with manual docker commands.
      - name: Build Windows 2022
        run: ./scripts/build-image.ps1 -NanoServerVersion "ltsc2022" -Repo "${{ env.REPO }}" -Tag "${{ env.TAG }}"

      - name: push images
        run: |
          docker push ${{ env.REPO }}/wins:${{ env.TAG }}-windows-ltsc2022

  create-push-image-windows-2019-using-2025:
    runs-on: windows-2025
    env:
      REPO: rancher
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: retrieve dockerhub credentials
        uses: rancher-eio/read-vault-secrets@0da85151ad1f19ed7986c41587e45aac1ace74b6 # v3
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/dockerhub/rancher/credentials username | DOCKER_USERNAME ;
            secret/data/github/repo/${{ github.repository }}/dockerhub/rancher/credentials password | DOCKER_PASSWORD

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      # This step is required otherwise the 'mage'
      # command cannot be used in subsequent steps
      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 'stable'
          cache: 'false'

      - name: Install Dependencies
        run: |
          go install github.com/magefile/mage@69e6f824732575e57977f68f8f3dd78313d666e5 # v1.16
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@c0d3ddc9cf3faa61a4e378e879ece580256d76e5 # v2.12.2

      # added a start docker service step to ensure that the docker service is running before running the e2e tests
      - name: Start Docker Service
        id: start-docker-service
        run: |
          $dockerSvc = Get-Service -Name "docker"
          if ($dockerSvc.Status -ne "Running") {
            Start-Service -Name "docker"
          }

      - name: build-binary
        run: |
          set PSModulePath=&&powershell -command "mage ci"

      # Note: We cannot use the docker/build-push-action as it requires dependencies
      # which cannot be installed onto windows VMs. Additionally, it is not possible to cross compile
      # Windows images on linux. So, we're stuck with manual docker commands.
      - name: Build Windows 2019
        run: ./scripts/build-image.ps1 -NanoServerVersion "ltsc2019" -Repo "${{ env.REPO }}" -Tag "${{ env.TAG }}"

      - name: push images
        run: |
          docker push ${{ env.REPO }}/wins:${{ env.TAG }}-windows-ltsc2019

  create-draft:
    runs-on: ubuntu-latest
    needs:
    - create-push-image-windows-2022
    - create-push-image-windows-2019-using-2025
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create -R "${GITHUB_REPOSITORY}" --draft --generate-notes "${GITHUB_REF_NAME}"

  build-binaries:
    needs: [ create-draft, create-push-image-windows-2019-using-2025, create-push-image-windows-2022 ]
    runs-on: windows-2022
    permissions:
      contents: write # required for writing release artifacts
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 'stable'

      - name: Install Dependencies
        run: |
          go install github.com/magefile/mage@69e6f824732575e57977f68f8f3dd78313d666e5 # v1.16
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@c0d3ddc9cf3faa61a4e378e879ece580256d76e5 # v2.12.2

      - name: build-binary
        run: |
          set PSModulePath=&&powershell -command "mage buildAll"

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifacts
          path: |
            artifacts/wins.exe
            artifacts/sha256.txt
            artifacts/sha512.txt
            artifacts/install.ps1
            artifacts/uninstall.ps1
            LICENSE
          if-no-files-found: error

  create-manifest:
    needs: [ create-push-image-windows-2019-using-2025, create-push-image-windows-2022 ]
    permissions:
      id-token: write
    env:
      REPO: rancher
      TAG: ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - name: retrieve dockerhub credentials
        uses: rancher-eio/read-vault-secrets@0da85151ad1f19ed7986c41587e45aac1ace74b6 # v3
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/dockerhub/rancher/credentials username | DOCKER_USERNAME ;
            secret/data/github/repo/${{ github.repository }}/dockerhub/rancher/credentials password | DOCKER_PASSWORD

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: create manifest list
        run: |
          docker manifest create ${{ env.REPO }}/wins:${{ env.TAG }} ${{ env.REPO }}/wins:${{ env.TAG }}-windows-ltsc2022 ${{ env.REPO }}/wins:${{ env.TAG }}-windows-ltsc2019
          docker manifest push ${{ env.REPO }}/wins:${{ env.TAG }}

  finalize-github-release:
    name: Publish GitHub release
    needs: [ build-binaries, create-manifest ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-artifacts
          path: /tmp/assets

      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload -R "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" /tmp/assets/artifacts/* /tmp/assets/LICENSE

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS="--draft=false"
          if [[ "${GITHUB_REF_NAME}" == *"-rc"* ]]; then
            FLAGS="${FLAGS} --prerelease"
          fi
          gh release edit -R "${GITHUB_REPOSITORY}" "${GITHUB_REF_NAME}" ${FLAGS}

  dispatch:
    name: Dispatch Rancher upgrade
    runs-on: ubuntu-latest
    needs:
      - finalize-github-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Read App secrets
        uses: rancher-eio/read-vault-secrets@0da85151ad1f19ed7986c41587e45aac1ace74b6 # v3
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/github/workflow-dispatcher/app-credentials appId | APP_ID ;
            secret/data/github/repo/${{ github.repository }}/github/workflow-dispatcher/app-credentials privateKey | PRIVATE_KEY
      - name: Create App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ env.APP_ID }}
          private-key: ${{ env.PRIVATE_KEY }}
          owner: rancher
          repositories: rancher
          permission-actions: write
      - name: Determine Rancher ref from tag
        id: rancher-ref
        shell: bash
        run: |
          set -euo pipefail

          case "${GITHUB_REF_NAME}" in
            v0.17.*) rancher_ref=main ;;
            v0.16.*) rancher_ref=release/v2.16 ;;
            v0.15.*) rancher_ref=release/v2.15 ;;
            v0.14.*) rancher_ref=release/v2.14 ;;
            v0.13.*) rancher_ref=release/v2.13 ;;
            v0.12.*) rancher_ref=release/v2.12 ;;
            v0.11.*) rancher_ref=release/v2.11 ;;
            *) rancher_ref=notfound ;;
          esac

          printf 'rancher_ref=%s\n' "$rancher_ref" >> "$GITHUB_OUTPUT"
      - name: Dispatch Wins upgrade
        if: ${{ steps.rancher-ref.outputs.rancher_ref != 'notfound' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh workflow run "Wins Upgrade" \
            --repo rancher/rancher \
            --ref "${{ steps.rancher-ref.outputs.rancher_ref }}" \
            -f wins_version="${GITHUB_REF_NAME}" \
            -f source_author="${GITHUB_ACTOR}" \
            -f source_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
